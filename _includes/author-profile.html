<div class="profile-card">
  <div class="author__avatar">
    <img src="{{ site.author.avatar | relative_url }}" width="128" height="128" alt="Jiahe Feng initials">
  </div>
  <div class="author__content">
    <h2 class="author__name">Jiahe Feng</h2>
    <p class="author__name-cn" lang="zh">冯嘉赫</p>
    <p class="author__affiliation">Tianjin University</p>
    <p class="author__location">Tianjin, China</p>
  </div>
  <div class="profile-links" aria-label="Contact and academic profiles">
    <a class="profile-link profile-link--primary" href="mailto:{{ site.author.email }}">{% include icon.html name="mail" %}<span>Email</span><span class="link-arrow" aria-hidden="true">↗</span></a>
    <a class="profile-link" href="{{ site.author.googlescholar }}" target="_blank" rel="noopener noreferrer">{% include icon.html name="scholar" %}<span>Google Scholar</span><span class="link-arrow" aria-hidden="true">↗</span></a>
    <a class="profile-link" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">{% include icon.html name="github" %}<span>GitHub</span><span class="link-arrow" aria-hidden="true">↗</span></a>
  </div>
</div>
